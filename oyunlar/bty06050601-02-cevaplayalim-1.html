*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Roboto',sans-serif;font-weight:300;background:#FFFFFF;color:#1A1A1A;}html,body{width:100%;height:100%;overflow:hidden;background:#FFFFFF;}
#stage{position:absolute;left:0;top:0;width:1920px;height:920px;transform-origin:0 0;}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
.wrapper{width:1920px;height:920px;display:flex;flex-direction:column;padding:24px 64px 20px;}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-shrink:0;}
.yonerge{font-size:36px;font-weight:300;color:#555;line-height:1.5;max-width:1300px;}
.hak-badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #DEDCD6;border-radius:10px;padding:12px 24px;font-size:30px;font-weight:300;color:#4A4A4A;flex-shrink:0;}
.hak-icon{font-size:34px;}
.hak-dots{display:inline-flex;gap:6px;margin-left:4px;}
.hak-dot{width:20px;height:20px;border-radius:50%;background:#CC1212;transition:background .3s,opacity .3s;}
.hak-dot.used{background:#DEDCD6;opacity:.5;}

.main-area{flex:1;display:flex;flex-direction:column;gap:var(--card-gap,18px);min-height:0;overflow:hidden;}
.scenario{display:flex;align-items:center;gap:0;background:#fff;border-radius:16px;overflow:hidden;border:2px solid transparent;box-shadow:0 2px 10px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.03);transition:border-color .3s,box-shadow .3s;flex:1;min-height:0;}
.scenario.correct{border-color:#2B8A3E;box-shadow:0 0 0 1px #2B8A3E,0 4px 16px rgba(43,138,62,.12);}
.scenario.revealed{border-color:#2B8A3E;box-shadow:0 0 0 1px #2B8A3E,0 4px 16px rgba(43,138,62,.12);opacity:.92;}
.scenario.wrong-shake{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.sc-accent{width:8px;align-self:stretch;flex-shrink:0;}
.sc-accent-1{background:linear-gradient(180deg,#FF6B6B,#CC1212);}
.sc-accent-2{background:linear-gradient(180deg,#FFA44F,#E07B20);}
.sc-accent-3{background:linear-gradient(180deg,#4DABF7,#1971C2);}
.sc-accent-4{background:linear-gradient(180deg,#9775FA,#7048C6);}
.sc-accent-5{background:linear-gradient(180deg,#20C997,#099268);}

.sc-num{width:var(--num-size,60px);height:var(--num-size,60px);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:var(--num-font,38px);font-weight:700;color:#fff;margin:0 20px 0 16px;flex-shrink:0;align-self:center;}
.sc-num-1{background:linear-gradient(135deg,#FF6B6B,#CC1212);}
.sc-num-2{background:linear-gradient(135deg,#FFA44F,#E07B20);}
.sc-num-3{background:linear-gradient(135deg,#4DABF7,#1971C2);}
.sc-num-4{background:linear-gradient(135deg,#9775FA,#7048C6);}
.sc-num-5{background:linear-gradient(135deg,#20C997,#099268);}

.sc-body{flex:1;padding:var(--body-pad,20px) 24px var(--body-pad,20px) 0;display:flex;flex-direction:column;justify-content:center;min-height:0;}
.sc-text{font-size:var(--text-font,34px);font-weight:300;line-height:1.45;color:#1A1A1A;}

.dd-select{display:inline-block;min-width:280px;padding:6px 44px 6px 14px;margin:0 6px;border:2px solid #A8A29E;border-radius:10px;background:#F5F3F0;font-family:'Roboto',sans-serif;font-size:var(--select-font,30px);font-weight:300;color:#1A1A1A;cursor:pointer;vertical-align:middle;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;transition:all .2s;}
.dd-select:hover{border-color:#1971C2;background-color:#E7F5FF;}
.dd-select:focus-visible{outline:3px solid #1971C2;outline-offset:2px;box-shadow:0 0 0 5px rgba(25,113,194,.15);}
.dd-select.filled{border-color:#A8A29E;background-color:#F5F3F0;color:#1A1A1A;font-weight:300;}
.dd-select.slot-correct{border-color:#2B8A3E;background:linear-gradient(135deg,#EBFBEE,#D3F9D8);color:#2B8A3E;font-weight:300;}
.dd-select.slot-revealed{border-color:#2B8A3E;background:linear-gradient(135deg,#EBFBEE,#D3F9D8);color:#2B8A3E;font-weight:300;pointer-events:none;}
.dd-select[data-filled="false"]{color:#999;}

.sc-result{width:48px;height:48px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;margin:0 20px;flex-shrink:0;align-self:center;}
.scenario.correct .sc-result,.scenario.revealed .sc-result{display:flex;background:#2B8A3E;}

.bottom-bar{display:flex;align-items:center;justify-content:center;gap:20px;padding-top:16px;flex-shrink:0;}
.btn-check{background:linear-gradient(135deg,#E03131,#CC1212);color:#fff;border:none;border-radius:12px;padding:18px 56px;font-family:'Roboto',sans-serif;font-size:36px;font-weight:500;cursor:pointer;transition:all .15s;box-shadow:0 4px 0 #8B0000,0 6px 20px rgba(204,18,18,.2);letter-spacing:.02em;}
.btn-check:hover{background:linear-gradient(135deg,#C92A2A,#B30F0F);transform:translateY(-1px);box-shadow:0 5px 0 #8B0000,0 8px 24px rgba(204,18,18,.25);}
.btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 #8B0000;}
.btn-check:disabled{background:linear-gradient(135deg,#CCC,#BBB);box-shadow:0 3px 0 #999;cursor:default;transform:none;}
.btn-check:focus-visible,.modal-btn:focus-visible{outline:3px solid #1971C2;outline-offset:3px;}

.modal-overlay{position:fixed;inset:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:#fff;border-radius:20px;padding:50px 60px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.2);max-width:650px;transform:scale(.9);transition:transform .25s;}
.modal-overlay.show .modal-box{transform:scale(1);}
.modal-icon{width:84px;height:84px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:18px;}
.modal-icon.success{background:linear-gradient(135deg,#EBFBEE,#D3F9D8);color:#2B8A3E;}
.modal-icon.error{background:linear-gradient(135deg,#FFF0F0,#FFE3E3);color:#CC1212;}
.modal-icon.info{background:linear-gradient(135deg,#E7F5FF,#D0EBFF);color:#1971C2;}
.modal-msg{font-size:42px;font-weight:300;line-height:1.5;color:#1A1A1A;margin-bottom:26px;}
.modal-btn{background:linear-gradient(135deg,#E03131,#CC1212);color:#fff;border:none;border-radius:12px;padding:16px 44px;font-family:'Roboto',sans-serif;font-size:32px;font-weight:500;cursor:pointer;transition:background .15s;}
.modal-btn:hover{background:linear-gradient(135deg,#C92A2A,#B30F0F);}
.modal-btn.success-btn{background:linear-gradient(135deg,#40C057,#2B8A3E);}
.modal-btn.success-btn:hover{background:linear-gradient(135deg,#37B24D,#237032);}
.modal-btn.info-btn{background:linear-gradient(135deg,#4DABF7,#1971C2);}
.modal-btn.info-btn:hover{background:linear-gradient(135deg,#339AF0,#1864AB);}
.modal-btns{display:flex;align-items:center;justify-content:center;gap:16px;}
.modal-btn-secondary{background:#fff;color:#4A4A4A;border:2px solid #DEDCD6;border-radius:12px;padding:16px 44px;font-family:'Roboto',sans-serif;font-size:30px;font-weight:300;cursor:pointer;transition:background .15s,border-color .15s;}
.modal-btn-secondary:hover{background:#F8F8F6;border-color:#9A9A9A;}
</style>
</head>

function _getCtx(){
  if(!_audioCtx){try{_audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(_audioCtx&&_audioCtx.state==="suspended"){try{_audioCtx.resume();}catch(e){}}
  return _audioCtx;
}
function _b64toAB(b64){
  var bin=atob(b64),len=bin.length,buf=new Uint8Array(len);
  for(var i=0;i<len;i++) buf[i]=bin.charCodeAt(i);
  return buf.buffer;
}
function _decodeAll(){
  if(_decoding)return;
  var ctx=_getCtx();if(!ctx)return;
  _decoding=true;
  if(!_bufCorrect){ctx.decodeAudioData(_b64toAB(_SND_CORRECT_B64),function(b){_bufCorrect=b;},function(){});}
  if(!_bufWrong){ctx.decodeAudioData(_b64toAB(_SND_WRONG_B64),function(b){_bufWrong=b;},function(){});}
}
function _playBuf(buf){
  var ctx=_getCtx();if(!ctx||!buf)return;
  var src=ctx.createBufferSource();
  src.buffer=buf;src.connect(ctx.destination);src.start(0);
}
function playSndCorrect(){
  if(_bufCorrect){_playBuf(_bufCorrect);}
  else{var ctx=_getCtx();if(ctx)ctx.decodeAudioData(_b64toAB(_SND_CORRECT_B64),function(b){_bufCorrect=b;_playBuf(b);},function(){});}
}
function playSndWrong(){
  if(_bufWrong){_playBuf(_bufWrong);}
  else{var ctx=_getCtx();if(ctx)ctx.decodeAudioData(_b64toAB(_SND_WRONG_B64),function(b){_bufWrong=b;_playBuf(b);},function(){});}
}
try{_decodeAll();}catch(e){}
document.addEventListener("click",function _u(){_getCtx();_decodeAll();document.removeEventListener("click",_u);},{once:true});
</script>

<script>
(function(){
  /* ── İÇERİK ── */
  var scenarios = [
    {head:'Ahmet, okulun tiyatro afişi için yapay zekâ ile özgün bir görsel tasarlamak istiyor. Ahmet\'in amacı ',
     tail:' olacaktır.',
     options:['Bilgi toplama','Dil çevirisi','Görsel oluşturma','Kod yazma'],
     answer:'Görsel oluşturma'},
    {head:'Elif, İngilizce ödevini çevirmek için bir görsel üreten yapay zekâ aracı seçti. Bu araç Elif\'in amacı için ',
     tail:'.',
     options:['Çok uygun bir seçimdir','Uygun değildir','Hızlı bir çözümdür','Tek doğru yoldur'],
     answer:'Uygun değildir'},
    {head:'Bir yapay zekâ aracı hızlı sonuç verdi ama ürettiği bilgi yanlıştı. Bu durumda eksik olan değerlendirme ölçütü ',
     tail:' olacaktır.',
     options:['Hız','Verimlilik','Doğruluk','Uygunluk'],
     answer:'Doğruluk'}
  ];

  /* ── AUTO-FIT ── */
  (function(){
    var n=scenarios.length,r=document.documentElement.style;
    if(n<=3){r.setProperty('--card-gap','18px');r.setProperty('--text-font','34px');r.setProperty('--select-font','30px');r.setProperty('--num-size','60px');r.setProperty('--num-font','38px');r.setProperty('--num-margin','20px');r.setProperty('--body-pad','20px');}
    else if(n<=4){r.setProperty('--card-gap','14px');r.setProperty('--text-font','30px');r.setProperty('--select-font','27px');r.setProperty('--num-size','52px');r.setProperty('--num-font','32px');r.setProperty('--num-margin','14px');r.setProperty('--body-pad','14px');}
    else{r.setProperty('--card-gap','10px');r.setProperty('--text-font','27px');r.setProperty('--select-font','24px');r.setProperty('--num-size','44px');r.setProperty('--num-font','28px');r.setProperty('--num-margin','10px');r.setProperty('--body-pad','10px');}
  })();

  (function buildScenarios(){
    var area=document.getElementById('mainArea');
    for(var i=0;i<scenarios.length;i++){
      var sc=scenarios[i],n=i+1,opts='<option value="">-- Seçiniz --</option>';
      for(var k=0;k<sc.options.length;k++){opts+='<option value="'+sc.options[k]+'">'+sc.options[k]+'</option>';}
      var d=document.createElement('div');
      d.className='scenario';d.id='sc-'+i;
      d.innerHTML='<div class="sc-accent sc-accent-'+n+'"></div>'+
        '<span class="sc-num sc-num-'+n+'" aria-hidden="true">'+n+'</span>'+
        '<div class="sc-body"><div class="sc-text">'+sc.head+
        '<select class="dd-select" data-scenario="'+i+'" data-selectid="b1" data-filled="false" aria-label="'+n+'. soru, boşluk">'+opts+'</select>'+
        sc.tail+'</div></div>'+
        '<span class="sc-result" aria-hidden="true"></span>';
      area.appendChild(d);
    }
  })();

  var attempts=0,maxAttempts=3,completed=false;
  var liveRegion=document.getElementById('liveRegion');
  function announce(m){liveRegion.textContent='';setTimeout(function(){liveRegion.textContent=m;},60);}

  function updateHakDots(){
    var r=maxAttempts-attempts;
    for(var i=1;i<=3;i++){var d=document.getElementById('hak'+i);if(i<=attempts)d.classList.add('used');else d.classList.remove('used');}
    document.getElementById('hakBadge').setAttribute('aria-label','Kalan hak: '+r);
  }

  function sel(i){return document.querySelector('.dd-select[data-scenario="'+i+'"][data-selectid="b1"]');}

  (function(){
    var all=document.querySelectorAll('.dd-select');
    for(var i=0;i<all.length;i++){
      (function(s){
        s.addEventListener('change',function(){
          if(s.classList.contains('slot-correct'))return;
          if(s.value){s.classList.add('filled');s.dataset.filled='true';}
          else{s.classList.remove('filled');s.dataset.filled='false';}
          announce('Seçim yapıldı: '+s.options[s.selectedIndex].text);
        });
      })(all[i]);
    }
  })();

  document.getElementById('btnCheck').addEventListener('click',function(){
    if(completed)return;
    var allFilled=true,allCorrect=true;
    for(var i=0;i<scenarios.length;i++){
      var s=sel(i);
      if(!s.value){allFilled=false;continue;}
      if(s.value!==scenarios[i].answer)allCorrect=false;
    }

    if(!allFilled){playSndWrong();showModal('error','Lütfen, tüm boşlukları doldurunuz!');return;}

    attempts++;updateHakDots();

    if(allCorrect){
      completed=true;playSndCorrect();
      for(var j=0;j<scenarios.length;j++){
        var scEl=document.getElementById('sc-'+j);
        scEl.classList.add('correct');
        scEl.querySelector('.sc-result').textContent='✓';
        var s2=sel(j);s2.classList.add('slot-correct');s2.disabled=true;
      }
      document.getElementById('btnCheck').style.display='none';
      showModal('success','Tebrikler! Devam etmek için tıklayınız.',function(){sendDevam();});
      return;
    }

    playSndWrong();

    if(attempts<maxAttempts){
      var remaining=maxAttempts-attempts;
      showModal('error','Lütfen, yeniden deneyiniz!',function(){
        for(var k=0;k<scenarios.length;k++){
          var e2=document.getElementById('sc-'+k);
          e2.classList.remove('correct');
          var s3=sel(k);
          s3.value='';s3.classList.remove('filled','slot-correct');s3.dataset.filled='false';s3.disabled=false;
          e2.classList.add('wrong-shake');
          (function(el){setTimeout(function(){el.classList.remove('wrong-shake');},400);})(e2);
        }
        announce('Seçimler sıfırlandı. Kalan hak: '+remaining);
      });
    } else {
      showModal('info','Cevapları görmek için tıklayınız.',function(){revealAnswers();});
    }
  });

  function revealAnswers(){
    completed=true;
    for(var i=0;i<scenarios.length;i++){
      var s=sel(i);
      s.value=scenarios[i].answer;s.classList.add('slot-revealed');s.disabled=true;
      var scEl=document.getElementById('sc-'+i);
      scEl.classList.add('revealed');
      scEl.querySelector('.sc-result').textContent='✓';
    }
    document.getElementById('btnCheck').disabled=true;
    announce('Doğru cevaplar gösterildi.');
    sendGeri();
  }

  /* ── MODAL ── */
  var lastFocus=null;
  function showModal(type,msg,onClose){
    lastFocus=document.activeElement;
    var ov=document.getElementById('modal'),ic=document.getElementById('modalIcon');
    var ms=document.getElementById('modalMsg'),bt=document.getElementById('modalBtn');
    var btBack=document.getElementById('modalBtnBack');
    ic.className='modal-icon';bt.className='modal-btn';btBack.style.display='none';
    if(type==='success'){ic.classList.add('success');ic.textContent='✓';bt.classList.add('success-btn');bt.textContent='Devam Et';bt.setAttribute('aria-label','Devam et');btBack.style.display='';}
    else if(type==='error'){ic.classList.add('error');ic.textContent='✗';bt.textContent='Tamam';bt.setAttribute('aria-label','Tamam, kapat');}
    else{ic.classList.add('info');ic.textContent='i';bt.classList.add('info-btn');bt.textContent='Cevapları Gör';bt.setAttribute('aria-label','Cevapları göster');}
    ms.textContent=msg;ov.classList.add('show');
    setTimeout(function(){bt.focus();},100);
    ov.onkeydown=function(e){if(e.key==='Tab'){e.preventDefault();bt.focus();}};
    bt.onclick=function(){ov.classList.remove('show');ov.onkeydown=null;if(onClose)onClose();if(lastFocus)try{lastFocus.focus();}catch(e){}};
    btBack.onclick=function(){ov.classList.remove('show');ov.onkeydown=null;sendGeri();if(lastFocus)try{lastFocus.focus();}catch(e){}};
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      var modal=document.getElementById('modal');
      if(modal.classList.contains('show')){document.getElementById('modalBtn').click();}
    }
  });

  /* ── STORYLINE ── */
  function sendVar(v){
    try{var p=GetPlayer();if(p&&p.SetVar){p.SetVar(v,1);return;}}catch(e){}
    try{var p2=window.parent.GetPlayer();if(p2&&p2.SetVar){p2.SetVar(v,1);return;}}catch(e){}
    try{window.parent.postMessage(JSON.stringify({type:'storyline',variable:v,value:1}),'*');}catch(e){}
    var rc=0,ri=setInterval(function(){rc++;if(rc>10){clearInterval(ri);return;}
      try{var p3=window.parent.GetPlayer();if(p3&&p3.SetVar){p3.SetVar(v,1);clearInterval(ri);}}catch(e){}
    },500);
  }
  function sendDevam(){ sendVar('devamEtkiles1'); }
  function sendGeri(){ sendVar('EtkilesSoru1'); }

  announce('Cevaplayalım 1 yüklendi. '+scenarios.length+' soruyu açılır listelerden seçerek cevaplayınız. 3 hakkınız bulunmaktadır.');
})();
</script>

<script>
/* ── SAHNE ÖLÇEKLEME: 1920x920 tasarım sahnesi pencereye tam oturur ── */
window.__S=1;
(function(){
  function fit(){
    var s=Math.min(window.innerWidth/1920, window.innerHeight/920);
    window.__S=s;
    var st=document.getElementById('stage');
    if(!st)return;
    var ox=(window.innerWidth-1920*s)/2, oy=(window.innerHeight-920*s)/2;
    st.style.transform='translate('+ox+'px,'+oy+'px) scale('+s+')';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',fit);
  document.addEventListener('DOMContentLoaded',fit);
  fit();
})();
</script>
