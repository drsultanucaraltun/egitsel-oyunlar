:root{
  --murekkep:#1E2A44;
  --vurgu:#2563EB;
  --vurgu-acik:#DBEAFE;
  --dogru:#15803D;
  --dogru-acik:#DCFCE7;
  --yanlis:#B45309;
  --yanlis-acik:#FEF3C7;
  --sari:#F59E0B;
  --lastik:#E4572E;
  --zemin1:#EAF4FF;
  --zemin2:#D6EBFF;
  --panel:#FFFFFF;
  --gri:#5B6472;
  --cizgi:#C6D2E8;
  --odak:#7C3AED;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;font-size:100%}
body{
  height:100%;
  font-family:'Roboto',Arial,sans-serif;
  font-weight:300;
  background:linear-gradient(var(--zemin1),var(--zemin2));
  color:var(--murekkep);
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--odak);outline-offset:2px}
b,strong{font-weight:700}
#uygulama{height:100%;display:flex;flex-direction:column}

/* ============ ÜST BAR ============ */
#ustbar{flex:0 0 auto;display:flex;align-items:center;gap:0.55rem;padding:0.45rem 1rem;background:var(--panel);border-bottom:3px solid var(--cizgi)}
#ustbar h1{font-size:1.5rem;font-weight:700;color:var(--vurgu);white-space:nowrap}
#skorlar{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:1.2rem;font-size:1.3rem;font-weight:700}
.skor-kutu{display:flex;align-items:center;gap:0.35rem;white-space:nowrap}
.skor-kutu svg{width:26px;height:26px}
.arac{min-width:48px;min-height:48px;border:2px solid var(--cizgi);border-radius:12px;background:var(--panel);color:var(--murekkep);font-size:1.15rem;font-weight:700;padding:0 0.6rem;display:inline-flex;align-items:center;justify-content:center}
.arac[aria-pressed="true"]{background:var(--vurgu-acik);border-color:var(--vurgu)}

/* ============ SAHNE ============ */
#sahnealani{flex:1 1 auto;min-height:0;position:relative}
.ekran{position:absolute;inset:0;display:none;flex-direction:column;padding:0.6rem 1.1rem;min-height:0}
.ekran.acik{display:flex}

/* ============ GİRİŞ ============ */
#ekran-giris{align-items:center;justify-content:center;text-align:center;gap:0.7rem}
#ekran-giris h2{font-size:3rem;font-weight:700;color:var(--vurgu)}
#ekran-giris p{font-size:1.4rem;max-width:50rem}
#giris-gorsel{display:block;width:min(56rem,92%);max-height:34vh;object-fit:cover;border-radius:18px;border:3px solid var(--cizgi);background:#C9A27E}
#btn-basla{font-size:1.5rem;font-weight:700;background:var(--vurgu);color:var(--panel);border:none;border-radius:16px;padding:0.85rem 2.2rem;min-height:64px;margin-top:0.3rem}

/* ============ OYUN ============ */
#gorev-serit{flex:0 0 auto;display:flex;align-items:center;gap:0.8rem;padding:0.2rem 0.2rem 0.35rem}
#bolum-no{flex:0 0 auto;font-size:1.05rem;font-weight:700;color:var(--vurgu);background:var(--vurgu-acik);border:2px solid var(--vurgu);border-radius:999px;padding:0.2rem 0.8rem;white-space:nowrap}
#gorev-no{flex:0 0 auto;font-size:1.1rem;font-weight:700;color:var(--gri);white-space:nowrap}
#gorev-metin{font-size:1.35rem;font-weight:700;flex:1;min-width:0}
#ilerleme-dis{flex:0 0 auto;height:12px;border-radius:8px;background:var(--panel);border:2px solid var(--cizgi);overflow:hidden}
#ilerleme-ic{height:100%;width:0;background:var(--vurgu);transition:width .25s}

#oyun-govde{flex:1 1 auto;min-height:0;display:flex;gap:0.8rem;padding-top:0.55rem}
#rehber{flex:0 0 auto;width:10.5rem;display:flex;flex-direction:column;align-items:center;gap:0.3rem}
#rehber-resim{width:100%;max-width:7.5rem;height:auto;display:block}
#rehber-soz{position:relative;font-size:1rem;line-height:1.3;text-align:left;background:var(--panel);border:3px solid var(--cizgi);border-radius:14px;padding:0.5rem 0.6rem;width:100%}
#rehber-soz:before{content:"";position:absolute;top:-12px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:10px solid var(--cizgi)}

#sahne-kap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:0.45rem}
#sahne-cerceve{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#sahne{display:block;border-radius:14px;border:3px solid var(--cizgi);background:#B58A62;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
#sahne:focus{outline:none}
#sahne:focus-visible{outline:4px solid var(--odak);outline-offset:2px}
#kontroller{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;justify-content:center;min-height:52px}
#klavye-ipucu{flex:0 0 auto;font-size:0.95rem;color:var(--gri);text-align:center}
.dugme{min-height:52px;font-size:1.15rem;font-weight:700;background:var(--panel);color:var(--murekkep);border:3px solid var(--cizgi);border-radius:14px;padding:0.35rem 1rem;display:inline-flex;align-items:center;gap:0.4rem}
.dugme:hover{border-color:var(--vurgu)}
.dugme svg{width:22px;height:22px;flex:0 0 auto}
.dugme.birincil{background:var(--vurgu);color:var(--panel);border-color:var(--vurgu)}
.dugme.devam{background:var(--dogru);color:var(--panel);border-color:var(--dogru)}
.dugme:disabled,.dugme.birincil:disabled{background:#E4E8F0;color:var(--gri);border-color:#E4E8F0;cursor:not-allowed}
.olcu-gosterge{font-size:1.2rem;font-weight:700;min-width:5.6rem;text-align:center;background:var(--vurgu-acik);border:2px solid var(--vurgu);border-radius:12px;padding:0.45rem 0.5rem}
.ayrac{width:2px;align-self:stretch;background:var(--cizgi);margin:0 0.2rem}

.kart{min-height:52px;min-width:4.6rem;font-size:1.3rem;font-weight:700;background:var(--panel);color:var(--murekkep);border:3px solid var(--cizgi);border-radius:14px;padding:0.35rem 0.9rem;touch-action:none}
.kart:hover{border-color:var(--vurgu)}
.kart[aria-pressed="true"]{background:var(--vurgu-acik);border-color:var(--vurgu);transform:translateY(-3px)}
.kart.suruklenen{opacity:.35}
.kart.sarsil,.sarsil{animation:sarsil .35s}
#tasinan{position:fixed;z-index:60;pointer-events:none;display:none;font-size:1.3rem;font-weight:700;background:var(--vurgu-acik);border:3px solid var(--vurgu);border-radius:14px;padding:0.35rem 0.9rem;box-shadow:0 6px 18px rgba(30,42,68,.25)}
@keyframes sarsil{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* SVG içi */
#sahne text{font-family:'Roboto',Arial,sans-serif;font-weight:700}
.etiket-kutu{fill:#FFFFFF;stroke:var(--murekkep);stroke-width:2}
.etiket-yazi{fill:var(--murekkep);font-size:20px}
.cift-a .etiket-kutu{stroke:#2563EB;stroke-width:3}
.cift-b .etiket-kutu{stroke:#D97706;stroke-width:3}
.aci-etiket{font-size:17px;fill:#1E2A44}
.olcek-cizgi{stroke:#1E2A44;stroke-width:1.3;fill:none}
.olcek-dis{fill:#1E2A44;font-size:17px}
.olcek-ic{fill:#9A3412;font-size:14px}
.civi-imlec{fill:none;stroke:var(--odak);stroke-width:4;stroke-dasharray:7 5}
.civi-uzeri{fill:rgba(37,99,235,.16);stroke:var(--vurgu);stroke-width:3}
.ilk-civi{fill:none;stroke:var(--lastik);stroke-width:4;animation:nabiz 1.1s ease-in-out infinite}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.25}}
.ipucu-cizgi{fill:none;stroke:var(--vurgu);stroke-width:4;stroke-dasharray:12 8;stroke-linejoin:round;opacity:.85}
.cember{fill:none;stroke-width:3}
.cember-a{stroke:#2563EB}
.cember-b{stroke:#C2410C}
.cember.ciziliyor{transition:stroke-dashoffset .9s linear}
.kesisim{fill:rgba(124,58,237,.18);stroke:var(--odak);stroke-width:3;cursor:pointer;animation:nabiz 1.1s ease-in-out infinite}
.yuva{cursor:pointer}
.yuva rect{fill:rgba(255,255,255,.92);stroke:#5B6472;stroke-width:3;stroke-dasharray:8 5}
.yuva.secili rect{stroke:var(--odak);stroke-dasharray:none;fill:#F3EEFF}
.yuva.dolu rect{stroke:var(--dogru);stroke-dasharray:none;fill:var(--dogru-acik)}
.yuva.hatali rect{stroke:var(--yanlis);fill:var(--yanlis-acik)}
.yuva text{font-size:24px;fill:var(--murekkep)}

/* ============ ATÖLYE PANOSU ============ */
#pano{flex:0 0 auto;width:10.4rem;display:flex;flex-direction:column;gap:0.35rem;background:var(--panel);border:3px solid var(--cizgi);border-radius:16px;padding:0.45rem}
#pano h2{font-size:1.05rem;font-weight:700;text-align:center;color:var(--vurgu)}
#pano-izgara{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:0.3rem}
.pano-hucre{min-height:0;display:flex;align-items:center;justify-content:center;border:2px dashed var(--cizgi);border-radius:10px;background:#F8FAFF;overflow:hidden}
.pano-hucre .no{font-size:1rem;font-weight:700;color:#97A3B6}
.pano-hucre svg{width:100%;height:100%;display:block}
.pano-hucre.dolu{border-style:solid;border-color:var(--dogru);background:#FFFFFF}
.pano-hucre.aktif{border-color:var(--vurgu);border-style:solid}
.pano-hucre.yeni{animation:yerles .6s ease-out}
@keyframes yerles{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

/* ============ SON ============ */
#ekran-son{align-items:center;justify-content:center;text-align:center;gap:0.6rem}
#son-ust{display:flex;align-items:center;gap:1rem}
#son-robot{width:6.5rem;height:auto}
#ekran-son h2{font-size:2.2rem;font-weight:700;color:var(--vurgu)}
#son-yildizlar{display:flex;gap:0.25rem;flex-wrap:wrap;justify-content:center}
#son-yildizlar svg{width:34px;height:34px}
#son-puan{font-size:1.5rem;font-weight:700}
#son-pano{display:grid;grid-template-columns:repeat(5,7.4rem);gap:0.5rem}
.son-hucre{background:var(--panel);border:3px solid var(--dogru);border-radius:12px;padding:0.3rem;display:flex;flex-direction:column;align-items:center}
.son-hucre svg{width:5.6rem;height:5.6rem}
.son-hucre span{font-size:0.95rem;font-weight:700;line-height:1.15}
.ikincil-buton{font-size:1.4rem;font-weight:700;background:var(--vurgu-acik);color:var(--murekkep);border:3px solid var(--vurgu);border-radius:14px;padding:0.6rem 1.8rem;min-height:60px}

/* ============ GERİ BİLDİRİM ============ */
#geribildirim{position:absolute;left:50%;top:0.5rem;transform:translateX(-50%);max-width:min(92%,50rem);font-size:1.25rem;font-weight:700;border-radius:14px;padding:0.55rem 1.1rem;display:none;text-align:center;z-index:40;box-shadow:0 6px 18px rgba(30,42,68,.18)}
#geribildirim.goster{display:block}
#geribildirim.iyi{background:var(--dogru-acik);color:var(--dogru);border:3px solid var(--dogru)}
#geribildirim.kotu{background:var(--yanlis-acik);color:var(--yanlis);border:3px solid var(--yanlis)}
#geribildirim.notr{background:var(--vurgu-acik);color:var(--murekkep);border:3px solid var(--vurgu)}
#geribildirim .gb-ikon{display:inline-block;width:1.4rem;height:1.4rem;vertical-align:-0.25rem;margin-right:0.35rem}

/* ============ ALT BAR ============ */
#altbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0.45rem 1.2rem;background:var(--panel);border-top:3px solid var(--cizgi)}
.gezinme{display:flex;align-items:center;gap:0.5rem;font-size:1.4rem;font-weight:700;min-height:60px;min-width:9rem;border-radius:14px;border:none;padding:0 1.4rem}
#btn-geri{background:var(--vurgu-acik);color:var(--murekkep)}
#btn-ileri{background:var(--vurgu);color:var(--panel)}
.gezinme:disabled,#btn-geri:disabled,#btn-ileri:disabled{background:#E4E8F0;color:var(--gri);cursor:not-allowed}
.gezinme svg{width:26px;height:26px;flex:0 0 auto}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media (max-height:820px){
  #ekran-giris h2{font-size:2.3rem}
  #ekran-giris p{font-size:1.2rem}
  #gorev-metin{font-size:1.2rem}
  #rehber-resim{max-width:6rem}
  #rehber-soz{font-size:0.95rem}
  #son-pano{grid-template-columns:repeat(5,6.4rem)}
  .son-hucre svg{width:4.6rem;height:4.6rem}
  #son-robot{width:5rem}
  #ekran-son h2{font-size:1.8rem}
}
@media (max-height:700px){
  #ustbar{padding:0.3rem 1rem}
  #altbar{padding:0.3rem 1.2rem}
  #klavye-ipucu{display:none}
  .dugme,.kart{min-height:48px}
  #giris-gorsel{max-height:28vh}
}
@media (max-width:1100px){
  #rehber{width:7rem}
  #pano{width:8.6rem}
}
</style>
</head>
<body>
<div id="uygulama">

  <header id="ustbar">
    <h1>Geometri Atölyesi</h1>
    <div id="skorlar">
      <span class="skor-kutu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.6 5.9 6.4.6-4.8 4.3 1.4 6.2L12 15.8 6.4 19l1.4-6.2L3 8.5l6.4-.6z" fill="#F59E0B"/></svg><span id="skor-yildiz">0 / 10</span></span>
      <span class="skor-kutu"><span>Puan:</span><span id="skor-puan">0</span></span>
    </div>
    <button class="arac" id="btn-kucult" type="button" aria-label="Yazıları küçültünüz">A−</button>
    <button class="arac" id="btn-buyut" type="button" aria-label="Yazıları büyütünüz">A+</button>
    <button class="arac" id="btn-ses" type="button" aria-pressed="true" aria-label="Sesi kapatınız"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#1E2A44"/><path id="ses-dalga" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="#1E2A44" stroke-width="2" stroke-linecap="round"/><line id="ses-cizgi" x1="4" y1="4" x2="21" y2="21" stroke="#B91C1C" stroke-width="2.6" stroke-linecap="round" style="display:none"/></svg></button>
  </header>

  <main id="sahnealani">

    <!-- ============ GİRİŞ ============ -->
    <section class="ekran acik" id="ekran-giris" aria-labelledby="giris-baslik">
      <h2 id="giris-baslik">Geometri Atölyesi</h2>
      <img id="giris-gorsel" alt="Çalışma masası üzerinde çivili tahta, açıölçer, pergel, geometri şeritleri ve rehber robot">
      <p>Atölyedeki <b>çivili tahta</b>, <b>açıölçer</b>, <b>şeritler</b> ve <b>pergel</b> ile şekiller kuracaksınız.</p>
      <p>Her doğru yapım <b>Atölye Panonuza</b> eklenir. Hata yaparsanız yeniden deneyiniz.</p>
      <button id="btn-basla" type="button">Oyunu başlatmak için tıklayınız.</button>
    </section>

    <!-- ============ OYUN ============ -->
    <section class="ekran" id="ekran-oyun" aria-labelledby="gorev-metin">
      <div id="gorev-serit">
        <span id="bolum-no">Çivili Tahta</span>
        <span id="gorev-no">1 / 10</span>
        <span id="gorev-metin" aria-live="polite"></span>
      </div>
      <div id="ilerleme-dis" role="progressbar" aria-label="Görev ilerlemesi" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <div id="ilerleme-ic"></div>
      </div>
      <div id="oyun-govde">
        <div id="rehber">
          <img id="rehber-resim" alt="Rehber robot">
          <div id="rehber-soz" aria-live="polite"></div>
        </div>
        <div id="sahne-kap">
          <div id="sahne-cerceve">
            <svg id="sahne" viewBox="0 0 840 600" preserveAspectRatio="xMidYMid meet" tabindex="0" role="application" aria-label="Çalışma alanı">
              <defs>
                <clipPath id="kagit-kirp"><rect x="30" y="30" width="780" height="540" rx="2"/></clipPath>
                <filter id="lastik-golge" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="3" dy="4" result="g"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>
              <g id="k-zemin"></g>
              <g id="k-oyun"></g>
              <g id="k-ust"></g>
            </svg>
          </div>
          <div id="kontroller"></div>
          <div id="klavye-ipucu"></div>
        </div>
        <aside id="pano" aria-labelledby="pano-baslik">
          <h2 id="pano-baslik">Atölye Panom</h2>
          <div id="pano-izgara"></div>
        </aside>
      </div>
    </section>

    <!-- ============ SON ============ -->
    <section class="ekran" id="ekran-son" aria-labelledby="son-baslik">
      <div id="son-ust">
        <img id="son-robot" alt="Sevinen rehber robot">
        <h2 id="son-baslik">Tebrikler! Atölye panonuz tamamlandı.</h2>
      </div>
      <div id="son-yildizlar" aria-hidden="true"></div>
      <div id="son-puan"></div>
      <div id="son-pano" aria-label="Yaptığınız şekiller"></div>
      <button class="ikincil-buton" id="btn-yeniden" type="button">Yeniden Oyna</button>
    </section>

    <div id="geribildirim" role="status" aria-live="assertive"></div>
  </main>

  <footer id="altbar">
    <button class="gezinme" id="btn-geri" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Geri
    </button>
    <button class="gezinme" id="btn-ileri" type="button" disabled>
      İleri
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </footer>
</div>
<div id="tasinan" aria-hidden="true"></div>

var sesBaglam=null;
function sesCal(tur){
  if(!sesAcik) return;
  try{
    if(!sesBaglam){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      sesBaglam=new AC();
    }
    if(sesBaglam.state==="suspended"){ sesBaglam.resume(); }
    var t=sesBaglam.currentTime;
    var notalar = tur==="dogru" ? [523,659,784,1047] : (tur==="yanlis" ? [311,262] : [520]);
    notalar.forEach(function(f,i){
      var o=sesBaglam.createOscillator(), g=sesBaglam.createGain();
      o.type = tur==="dogru" ? "triangle" : "sine";
      o.frequency.value=f;
      var sure = tur==="tik" ? 0.05 : 0.15;
      g.gain.setValueAtTime(0.0001,t+i*0.1);
      g.gain.exponentialRampToValueAtTime(tur==="tik"?0.08:0.18,t+i*0.1+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.1+sure);
      o.connect(g); g.connect(sesBaglam.destination);
      o.start(t+i*0.1); o.stop(t+i*0.1+sure+0.03);
    });
  }catch(e){}
}

/* (cx,cy) merkezli, a1'den a2'ye (matematik yönünde, derece) daire dilimi */
function dilim(cx,cy,r,a1,a2){
  var x1=cx+r*Math.cos(rad(a1)), y1=cy-r*Math.sin(rad(a1));
  var x2=cx+r*Math.cos(rad(a2)), y2=cy-r*Math.sin(rad(a2));

/* ============ BÖLÜM 1: ÇİVİLİ TAHTA ============ */
var TAHTA={x0:60, y0:60, ara:80, sutun:10, satir:7};
function civiXY(c){ return {x:TAHTA.x0+c[0]*TAHTA.ara, y:TAHTA.y0+c[1]*TAHTA.ara}; }
function ayniCivi(a,b){ return a && b && a[0]===b[0] && a[1]===b[1]; }
function enYakinCivi(p){
  var i=Math.round((p.x-TAHTA.x0)/TAHTA.ara), j=Math.round((p.y-TAHTA.y0)/TAHTA.ara);
  if(i<0||j<0||i>=TAHTA.sutun||j>=TAHTA.satir) return null;
  var q=civiXY([i,j]);
  if(Math.abs(q.x-p.x)>34||Math.abs(q.y-p.y)>34) return null;
  return [i,j];
}
function sadelestir(pts){
  var p=pts.slice(), degisti=true, i, a, b, c, cr;
  while(degisti && p.length>=3){
    degisti=false;
    for(i=0;i<p.length;i++){
      a=p[(i+p.length-1)%p.length]; b=p[i]; c=p[(i+1)%p.length];
      cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
      if(cr===0){ p.splice(i,1); degisti=true; break; }
    }
  }
  return p;
}
function kesisirMi(p1,p2,p3,p4){
  function yon(a,b,c){ var v=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]); return v>0?1:(v<0?-1:0); }
  var d1=yon(p3,p4,p1), d2=yon(p3,p4,p2), d3=yon(p1,p2,p3), d4=yon(p1,p2,p4);
  return d1*d2<0 && d3*d4<0;
}
function kendiniKeser(p){
  var n=p.length, i, j;
  for(i=0;i<n;i++){
    for(j=i+1;j<n;j++){
      if(j===i+1 || (i===0 && j===n-1)) continue;
      if(kesisirMi(p[i],p[(i+1)%n],p[j],p[(j+1)%n])) return true;
    }
  }
  return false;
}
function uzunluk(a,b){ return Math.sqrt((a[0]-b[0])*(a[0]-b[0])+(a[1]-b[1])*(a[1]-b[1])); }
function dikdortgenMi(p){
  if(p.length!==4) return false;
  for(var i=0;i<4;i++){
    var a=p[(i+3)%4], b=p[i], c=p[(i+1)%4];
    if((a[0]-b[0])*(c[0]-b[0])+(a[1]-b[1])*(c[1]-b[1])!==0) return false;
  }
  return true;
}

      svgEl(D.kapali?"polygon":"polyline",{points:nokta,fill:"none",stroke:"#FF9B7A","stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round",opacity:.8,transform:"translate(-1,-1.5)"},ko);

      var p=civiXY([orta.x+dx, orta.y+dy]);

    var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys), i, j;
    for(i=x0;i<x1;i++){

  ipucu:function(){ D.ipucu=true; MOD.tahta.ciz(); },

  },
  disari:function(){ D.uzeri=null; D.isaretci=null; MOD.tahta.ciz(); },
  tus:function(e){
    var k=e.key, im=D.imlec;

    else if(k==="ArrowRight"){ im[0]=Math.min(TAHTA.sutun-1,im[0]+1); }
    else if(k==="ArrowUp"){ im[1]=Math.max(0,im[1]-1); }
    else if(k==="ArrowDown"){ im[1]=Math.min(TAHTA.satir-1,im[1]+1); }
    else if(k==="Enter"||k===" "||k==="Spacebar"){ MOD.tahta.sec([im[0],im[1]]); }
    else if(k==="Backspace"){ MOD.tahta.geriAl(); }
    else return false;
    D.klavye=true;
    MOD.tahta.ciz();
    return true;
  },
  kontrol:function(){
    if(gorevBitti) return;
    var g=GOREVLER[gorevIndeks];
    if(D.lastik.length<2){
      bildir("Önce çivilere tıklayarak lastiği geçiriniz.","notr");
      return;
    }
    if(!D.kapali){
      var ko=$("k-oyun");
      ko.classList.remove("sarsil"); void ko.getBoundingClientRect(); ko.classList.add("sarsil");
      gorevHatali("Lastik açık kaldı! Çokgenler kapalı şekillerdir. Son çividen ilk çiviye geri dönünüz.",MOD.tahta.imza());
      return;
    }
    var P=sadelestir(D.lastik), n=P.length;
    var imza=MOD.tahta.imza();
    if(n<3){ gorevHatali("Seçtiğiniz çiviler aynı doğru üzerinde. Böyle kapalı bir şekil oluşmaz.",imza); return; }
    if(kendiniKeser(P)){ gorevHatali("Lastik kendi üzerinden geçti. Kenarları birbirini kesmeyen kapalı bir şekil kurunuz.",imza); return; }
    if(g.hedef==="ucgen"){
      if(n===3){
        D.basarili=true; D.ipucu=false; MOD.tahta.ciz();
        gorevBasarili("Harika! 3 kenarı ve 3 köşesi olan kapalı bir şekil: üçgen.",{nokta:P});
      }else{
        gorevHatali("Şeklinizin "+n+" kenarı var, bu bir "+(n===4?"dörtgen":n+"gen")+". Üçgenin 3 kenarı vardır.",imza);
      }
      return;
    }
    /* dikdörtgen */
    if(n!==4){ gorevHatali(n===3?"Bu bir üçgen. Dikdörtgenin 4 kenarı ve 4 köşesi vardır.":"Şeklinizin "+n+" kenarı var. Dikdörtgenin 4 kenarı vardır.",imza); return; }
    if(!dikdortgenMi(P)){ gorevHatali("Bu dörtgenin açıları dik değil. Dikdörtgende dört açının hepsi 90°'dir.",imza); return; }
    var a=uzunluk(P[0],P[1]), b=uzunluk(P[1],P[2]);
    var kisa=Math.min(a,b), uzun=Math.max(a,b);
    var cevre=2*(a+b), alan=a*b;
    var cevreTamam=Math.abs(cevre-g.cevre)<1e-6, alanTamam=!g.alan || Math.abs(alan-g.alan)<1e-6;
    var ks=sayiYaz(kisa), us=sayiYaz(uzun);
    if(!cevreTamam){
      gorevHatali("Kenarlar "+ks+" br ve "+us+" br. Çevre: "+ks+" + "+us+" + "+ks+" + "+us+" = "+sayiYaz(cevre)+" br. İstenen "+g.cevre+" br.",imza);
      return;
    }
    if(!alanTamam){
      gorevHatali("Çevre "+g.cevre+" br, doğru! Ama alan "+ks+" × "+us+" = "+sayiYaz(alan)+" birim kare. İstenen "+g.alan+" birim kare.",imza);
      return;
    }
    D.basarili=true; D.ipucu=false; D.birimKare=(P[0][0]===P[1][0]||P[0][1]===P[1][1]);
    var xs=P.map(function(c){return c[0];}), ys=P.map(function(c){return c[1];});
    var orta=civiXY([(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2,(Math.min.apply(null,ys)+Math.max.apply(null,ys))/2]);
    D.alanEtiket={metin:"Alan: "+sayiYaz(alan)+" birim kare", x:orta.x, y:orta.y};
    MOD.tahta.ciz();
    var mesaj;
    if(!g.alan){
      var digerleri=[], s;
      for(s=1;s<=3;s++){ if(Math.abs(s-kisa)>1e-6) digerleri.push(s+" × "+(7-s)); }
      mesaj="Doğru! "+ks+" × "+us+" dikdörtgenin çevresi 14 br, alanı "+sayiYaz(alan)+" birim kare. "+digerleri.join(" ve ")+" dikdörtgenlerinin de çevresi 14 br!";
    }else{
      mesaj="Doğru! 2 × 6 dikdörtgen: alan 12 birim kare, çevre 16 br. 3 × 4'ün alanı da 12 ama çevresi 14 br. Aynı alan, farklı çevre!";
    }
    gorevBasarili(mesaj,{nokta:P, dikdortgen:true});
  }
};

function aciolcerOlustur(ebeveyn){
  var v=VARLIK.aciolcer, g=svgEl("g",{},ebeveyn), R=230, d="", i, a, c, s, uz, t;
  sprite(v,0,0,g);
  for(i=0;i<=180;i++){
    a=rad(i); c=Math.cos(a); s=Math.sin(a);
    uz = i%10===0 ? 20 : (i%5===0 ? 13 : 7);
    d+="M"+f1((R-2)*c)+" "+f1(-(R-2)*s)+"L"+f1((R-2-uz)*c)+" "+f1(-(R-2-uz)*s);
  }
  d+="M"+(-R+8)+" 0L"+(R-8)+" 0M-9 0L9 0M0 -9L0 9";
  svgEl("path",{d:d,"class":"olcek-cizgi"},g);
  for(i=0;i<=180;i+=10){
    a=rad(i); c=Math.cos(a); s=Math.sin(a);
    t=svgEl("text",{x:f1((R-36)*c),y:f1(-(R-36)*s),"text-anchor":"middle","dominant-baseline":"central","class":"olcek-dis",transform:"rotate("+(90-i)+" "+f1((R-36)*c)+" "+f1(-(R-36)*s)+")"},g);
    t.textContent=String(180-i);
    t=svgEl("text",{x:f1((R-60)*c),y:f1(-(R-60)*s),"text-anchor":"middle","dominant-baseline":"central","class":"olcek-ic",transform:"rotate("+(90-i)+" "+f1((R-60)*c)+" "+f1(-(R-60)*s)+")"},g);
    t.textContent=String(i);
  }
  svgEl("circle",{cx:0,cy:0,r:4.5,fill:"none",stroke:"#1E2A44","stroke-width":1.5},g);
  return g;
}

/* Eş kenarlara aynı çentik; hepsi farklıysa 1, 2, 3 çentik */
function centikSayilari(uz){
  var tekrar={}, sonuc={}, i, n=0;
  for(i=0;i<uz.length;i++) tekrar[uz[i]]=(tekrar[uz[i]]||0)+1;
  var esVar=false;
  for(i=0;i<uz.length;i++) if(tekrar[uz[i]]>1) esVar=true;
  for(i=0;i<uz.length;i++){
    if(sonuc[uz[i]]!==undefined) continue;
    if(esVar){ sonuc[uz[i]] = tekrar[uz[i]]>1 ? 1 : 0; }
    else { n++; sonuc[uz[i]]=n; }
  }
  return sonuc;
}

    });
    [sA,sB,sC].forEach(function(s,i){
      var dx=gm.x-s.x, dy=gm.y-s.y, L=Math.sqrt(dx*dx+dy*dy), t=svgEl("text",{x:f1(s.x+dx/L*40),y:f1(s.y+dy/L*40+6),"text-anchor":"middle","class":"aci-etiket"},D.gEtiket);
      t.textContent=acilar[i]+"°";
    });
    svgEl("circle",{cx:f1(sC.x),cy:f1(sC.y),r:6,fill:"#1E2A44"},D.gUcgen);
    var t=svgEl("text",{x:f1(sC.x),y:f1(sC.y+(C.y>=0?-16:34)),"text-anchor":"middle","font-size":26,fill:"#1E2A44"},D.gEtiket);
    t.textContent="C";
  },
  ipucu:function(){},
  basla:function(e,p){
    if(gorevBitti || !D.kesisim.length || D.C) return;
    var en=-1, enD=1e9;
    D.kesisim.forEach(function(u,i){
      var s=birimdenSahneye(u), dd=(s.x-p.x)*(s.x-p.x)+(s.y-p.y)*(s.y-p.y);
      if(dd<enD){ enD=dd; en=i; }
    });
    if(en>=0 && enD<34*34) MOD.pergel.cSec(en);
  },
  tus:function(e){
    if((e.key==="Enter"||e.key===" ") && D.kesisim.length && !D.C){ MOD.pergel.cSec(0); return true; }
    return false;
  }
};

/* ============ PANO ============ */
function miniSvg(i){
  var g=GOREVLER[i], v=panoVeri[i]||{}, s='<svg viewBox="0 0 100 100" aria-hidden="true">', j;
  if(g.tur==="tahta"){
    var P=v.nokta, xs=P.map(function(c){return c[0];}), ys=P.map(function(c){return c[1];});
    var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
    var w=Math.max(1,x1-x0), h=Math.max(1,y1-y0), k=Math.min(76/w,76/h), ox=50-(x0+x1)/2*k, oy=50-(y0+y1)/2*k;
    if(v.dikdortgen){
      for(j=x0+1;j<x1;j++) s+='<line x1="'+f1(ox+j*k)+'" y1="'+f1(oy+y0*k)+'" x2="'+f1(ox+j*k)+'" y2="'+f1(oy+y1*k)+'" stroke="#86C99A" stroke-width="1.5"/>';
      for(j=y0+1;j<y1;j++) s+='<line x1="'+f1(ox+x0*k)+'" y1="'+f1(oy+j*k)+'" x2="'+f1(ox+x1*k)+'" y2="'+f1(oy+j*k)+'" stroke="#86C99A" stroke-width="1.5"/>';
    }
    s+='<polygon points="'+P.map(function(c){ return f1(ox+c[0]*k)+","+f1(oy+c[1]*k); }).join(" ")+'" fill="rgba(228,87,46,.15)" stroke="#E4572E" stroke-width="5" stroke-linejoin="round"/>';
  }else if(g.tur==="aci"){
    var yon=v.sabit==="sag"?v.aci:180-v.aci, bx=v.sabit==="sag"?18:82, by=78;
    var sabitX=v.sabit==="sag"?96:4;
    var mx=f1(50+44*Math.cos(rad(yon))), my=f1(by-44*Math.sin(rad(yon)));
    s+='<path d="'+dilim(50,by,20,v.sabit==="sag"?0:yon,v.sabit==="sag"?yon:180)+'" fill="rgba(21,128,61,.25)" stroke="#15803D" stroke-width="2"/>';
    s+='<line x1="50" y1="'+by+'" x2="'+sabitX+'" y2="'+by+'" stroke="#F2B705" stroke-width="7" stroke-linecap="round"/>';
    s+='<line x1="50" y1="'+by+'" x2="'+mx+'" y2="'+my+'" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>';
    s+='<text x="50" y="22" text-anchor="middle" font-size="20" font-weight="700" fill="#1E2A44">'+v.aci+'°</text>';
  }else if(g.tur==="dikme"){
    s+='<line x1="8" y1="50" x2="92" y2="50" stroke="#F2B705" stroke-width="8" stroke-linecap="round"/>';
    s+='<line x1="50" y1="8" x2="50" y2="92" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>';
    s+='<path d="M50 34H66V50" fill="none" stroke="#15803D" stroke-width="3"/><path d="M34 50V66H50" fill="none" stroke="#15803D" stroke-width="3"/>';
  }else if(g.tur==="aciBul"){
    var t=v.teta||65, c=Math.cos(rad(t))*44, sn=Math.sin(rad(t))*44;
    s+='<line x1="6" y1="56" x2="94" y2="56" stroke="#F2B705" stroke-width="7" stroke-linecap="round"/>';
    s+='<line x1="'+f1(50-c)+'" y1="'+f1(56+sn)+'" x2="'+f1(50+c)+'" y2="'+f1(56-sn)+'" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>';
    s+='<text x="80" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A44">'+t+'°</text>';
    s+='<text x="20" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A44">'+t+'°</text>';
    s+='<text x="26" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">'+(180-t)+'°</text>';
    s+='<text x="76" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">'+(180-t)+'°</text>';
  }else if(g.tur==="pergel"){
    var pts=[v.A,v.B,v.C], minx=0, maxx=PG.ab, miny=Math.min(0,v.C.y), maxy=Math.max(0,v.C.y);
    minx=Math.min(minx,v.C.x); maxx=Math.max(maxx,v.C.x);
    var kk=Math.min(80/(maxx-minx),80/Math.max(1,maxy-miny)), cx=(minx+maxx)/2, cy=(miny+maxy)/2;
    var q=pts.map(function(p){ return {x:50+(p.x-cx)*kk, y:50-(p.y-cy)*kk}; });
    s+='<polygon points="'+q.map(function(p){ return f1(p.x)+","+f1(p.y); }).join(" ")+'" fill="rgba(21,128,61,.15)" stroke="#15803D" stroke-width="4" stroke-linejoin="round"/>';
    var kn=[[0,1,v.kenar.AB],[0,2,v.kenar.AC],[1,2,v.kenar.BC]], grp=centikSayilari([v.kenar.AB,v.kenar.AC,v.kenar.BC]);
    kn.forEach(function(e){
      var p=q[e[0]], r=q[e[1]], mx2=(p.x+r.x)/2, my2=(p.y+r.y)/2, dx=r.x-p.x, dy=r.y-p.y, L=Math.sqrt(dx*dx+dy*dy), nx=-dy/L*6, ny=dx/L*6, n=grp[e[2]]||0, z;
      for(z=0;z<n;z++){ var o=(z-(n-1)/2)*5, tx=dx/L*o, ty=dy/L*o; s+='<line x1="'+f1(mx2+tx+nx)+'" y1="'+f1(my2+ty+ny)+'" x2="'+f1(mx2+tx-nx)+'" y2="'+f1(my2+ty-ny)+'" stroke="#1E2A44" stroke-width="2.5"/>'; }
    });
  }
  return s+'</svg>';
}
function panoKur(){
  var iz=$("pano-izgara"), i;
  bosalt(iz);
  for(i=0;i<GOREVLER.length;i++){
    var d=document.createElement("div");
    d.className="pano-hucre";
    d.id="pano-"+i;
    d.setAttribute("role","img");
    d.setAttribute("aria-label",(i+1)+". görev: henüz yapılmadı");
    d.innerHTML='<span class="no">'+(i+1)+'</span>';
    iz.appendChild(d);
  }
}
function panoDoldur(i){
  var d=$("pano-"+i);
  d.className="pano-hucre dolu yeni";
  d.innerHTML=miniSvg(i);
  d.title=GOREVLER[i].pano;
  d.setAttribute("aria-label",(i+1)+". görev: "+GOREVLER[i].pano);
}
function panoAktif(i){
  var k;
  for(k=0;k<GOREVLER.length;k++){
    var d=$("pano-"+k);
    if(d && !panoVeri[k]) d.className="pano-hucre"+(k===i?" aktif":"");
  }
}

/* ============ SCORM (varsa) ============ */
var scormAPI=null;
function scormBul(){
  try{
    var w=window, n=0;
    while(w && n<12){
      if(w.API) return w.API;
      if(w.parent===w) break;
      w=w.parent; n++;
    }
    if(window.opener && window.opener.API) return window.opener.API;
  }catch(e){}
  return null;
}
function scormBasla(){
  try{ scormAPI=scormBul(); if(scormAPI) scormAPI.LMSInitialize(""); }catch(e){ scormAPI=null; }
}
function scormBitir(){
  if(!scormAPI) return;
  try{
    scormAPI.LMSSetValue("cmi.core.score.raw",String(puan));
    scormAPI.LMSSetValue("cmi.core.score.min","0");
    scormAPI.LMSSetValue("cmi.core.score.max","100");
    scormAPI.LMSSetValue("cmi.core.lesson_status",puan>=50?"passed":"completed");
    scormAPI.LMSCommit("");
  }catch(e){}
}

/* ============ EKRAN GEÇİŞİ ============ */
function ekranAc(i){
  aktif=i;
  ekranlar.forEach(function(id,k){ $(id).classList.toggle("acik",k===i); });
  $("btn-geri").disabled=(i===0);
  $("btn-ileri").disabled=!(i===1 && oyunBitti);
  bildirimTemizle();
  if(i===1) setTimeout(boyutla,0);
}

/* ============ GÖREV AKIŞI ============ */
function gorevYukle(){
  var g=GOREVLER[gorevIndeks];
  gorevYanlis=0; gorevBitti=false; kilit=false;
  D={};
  bosalt($("k-oyun")); bosalt($("k-ust")); bosalt($("kontroller"));
  sahne.removeAttribute("aria-valuetext");
  $("bolum-no").textContent="Bölüm "+(g.bolum+1)+": "+BOLUMLER[g.bolum];
  $("gorev-no").textContent=(gorevIndeks+1)+" / "+GOREVLER.length;
  $("gorev-metin").textContent=g.metin;
  $("klavye-ipucu").textContent=KLAVYE[g.tur]||"";
  sahne.setAttribute("aria-label",g.metin+" "+(KLAVYE[g.tur]||""));
  ilerlemeGuncelle(gorevIndeks);
  rehberSoyle(g.rehber,"notr");
  bildirimTemizle();
  panoAktif(gorevIndeks);
  MOD[g.tur].kur(g);
}

function oyunuBitir(){
  oyunBitti=true;
  ilerlemeGuncelle(GOREVLER.length);
  var kap=$("son-yildizlar"), i;
  kap.innerHTML="";
  for(i=0;i<GOREVLER.length;i++){
    var d=document.createElement("div");
    d.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 2l2.6 5.9 6.4.6-4.8 4.3 1.4 6.2L12 15.8 6.4 19l1.4-6.2L3 8.5l6.4-.6z" fill="'+(i<yildiz?"#F59E0B":"#E4E8F0")+'"/></svg>';
    kap.appendChild(d);
  }
  $("son-puan").textContent="Puanınız: "+puan+" / 100 — Yıldız: "+yildiz+" / "+GOREVLER.length;
  var sp=$("son-pano");
  sp.innerHTML="";
  for(i=0;i<GOREVLER.length;i++){
    var h=document.createElement("div");
    h.className="son-hucre";
    h.innerHTML=miniSvg(i)+"<span>"+GOREVLER[i].pano+"</span>";
    sp.appendChild(h);
  }
  scormBitir();
  ekranAc(2);
}

function oyunuBaslat(){
  gorevIndeks=0; yildiz=0; puan=0; gorevYanlis=0;
  kilit=false; oyunBitti=false; gorevBitti=false;
  panoVeri=[];
  skorGuncelle();
  bildirimTemizle();
  panoKur();
  gorevYukle();
}

/* ============ OLAYLAR ============ */
geribildirim=$("geribildirim");
sahne=$("sahne");
$("ilerleme-dis").setAttribute("aria-valuemax",GOREVLER.length);
$("skor-yildiz").textContent="0 / "+GOREVLER.length;

function etkinMod(){ return MOD[GOREVLER[gorevIndeks].tur]; }
var basili=false;
sahne.addEventListener("pointerdown",function(e){
  if(aktif!==1 || kilit) return;
  var m=etkinMod();
  basili=true;
  if(m.yakala){ try{ sahne.setPointerCapture(e.pointerId); }catch(er){} }
  D.klavye=false;
  if(m.basla) m.basla(e,svgNokta(e));
  e.preventDefault();
});
sahne.addEventListener("pointermove",function(e){
  if(aktif!==1) return;
  var m=etkinMod();
  if(m.surukle && (basili || GOREVLER[gorevIndeks].tur==="tahta")) m.surukle(e,svgNokta(e));
});
function sahneBirak(e){
  if(!basili) return;
  basili=false;
  var m=etkinMod();
  if(m.birak) m.birak(e);
}
sahne.addEventListener("pointerup",sahneBirak);
sahne.addEventListener("pointercancel",sahneBirak);
sahne.addEventListener("pointerleave",function(){
  var m=etkinMod();
  if(aktif===1 && m.disari) m.disari();
});
sahne.addEventListener("keydown",function(e){
  if(aktif!==1 || kilit || gorevBitti) return;
  var m=etkinMod();
  if(m.tus && m.tus(e)){ e.preventDefault(); }
});
document.addEventListener("pointermove",function(e){ if(D.surukDurum && MOD.aciBul.surukHareket) MOD.aciBul.surukHareket(e); });
document.addEventListener("pointerup",function(e){ if(D.surukDurum) MOD.aciBul.surukBitir(e); });
window.addEventListener("resize",boyutla);

$("btn-ses").addEventListener("click",function(){
  sesAcik=!sesAcik;
  this.setAttribute("aria-pressed",sesAcik?"true":"false");
  this.setAttribute("aria-label",sesAcik?"Sesi kapatınız":"Sesi açınız");
  $("ses-dalga").style.display=sesAcik?"":"none";
  $("ses-cizgi").style.display=sesAcik?"none":"";
});
$("btn-buyut").addEventListener("click",function(){
  if(yaziOlcek<130){ yaziOlcek+=10; document.documentElement.style.fontSize=yaziOlcek+"%"; boyutla(); }
});
$("btn-kucult").addEventListener("click",function(){
  if(yaziOlcek>90){ yaziOlcek-=10; document.documentElement.style.fontSize=yaziOlcek+"%"; boyutla(); }
});
$("btn-geri").addEventListener("click",function(){ if(aktif>0) ekranAc(aktif-1); });
$("btn-ileri").addEventListener("click",function(){ if(aktif===1 && oyunBitti) ekranAc(2); });
$("btn-basla").addEventListener("click",function(){ sesCal("tik"); oyunuBaslat(); ekranAc(1); });
$("btn-yeniden").addEventListener("click",function(){ oyunuBaslat(); ekranAc(0); });

/* ============ BAŞLANGIÇ ============ */
$("giris-gorsel").src=VARLIK.giris.src;
$("son-robot").src=VARLIK.robot_sevinc.src;
scormBasla();
oyunuBaslat();
ekranAc(0);
</script>
